name: Mirror

# GitHub stays the primary repository and the only place release assets live;
# Gitee mirrors branches and tags so the code is reachable from mainland China.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitee
  cancel-in-progress: false

jobs:
  gitee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Needs two repository secrets: GITEE_TOKEN (私人令牌 with 仓库写权限) and
      # GITEE_USER (the Gitee account name). Without them the mirror is skipped
      # with a warning so a fork or a fresh clone never fails on it.
      - name: Push branches and tags to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_USER" ]; then
            echo "::warning::GITEE_TOKEN or GITEE_USER is not set; skipping the Gitee mirror"
            exit 0
          fi
          remote="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/shimo-office/office-suites.git"
          # GitHub is authoritative, so mirror with force. Do not use --prune
          # here: a tag-triggered run has no local branches, and --prune would
          # then try to delete the mirror's default branch, which Gitee rejects.
          git push --force "$remote" \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

          # Refs deleted on GitHub must disappear from the mirror too. Compare
          # against GitHub, not the local clone, so a tag run still knows the
          # full branch list. The default branch is never deleted.
          default_branch=main
          stale_branches=$(comm -13 \
            <(git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort) \
            <(git ls-remote --heads "$remote" | sed 's#.*refs/heads/##' | sort) || true)
          for branch in $stale_branches; do
            if [ "$branch" = "$default_branch" ]; then
              continue
            fi
            echo "removing branch absent from the source: $branch"
            git push --quiet "$remote" ":refs/heads/$branch" ||
              echo "::warning::could not delete mirrored branch $branch"
          done

          # Some git builds ship without --prune-tags, so remove stale tags
          # explicitly instead of relying on --prune.
          stale_tags=$(comm -13 \
            <(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | sort) \
            <(git ls-remote --tags --refs "$remote" | sed 's#.*refs/tags/##' | sort) || true)
          for tag in $stale_tags; do
            echo "removing tag absent from the source: $tag"
            git push --quiet "$remote" ":refs/tags/$tag" ||
              echo "::warning::could not delete mirrored tag $tag"
          done

          # The mirror's main is then replaced by one extra commit whose READMEs
          # point at Gitee. Build it from origin/main explicitly: a tag-triggered
          # run has a tag checked out, not the branch head.
          git fetch --no-tags origin main
          git checkout -B mirror-main FETCH_HEAD
          python3 scripts/render_mirror_readme.py
          if git diff --quiet -- README.md README.en.md; then
            echo "READMEs already point at the mirror; nothing to commit"
            exit 0
          fi
          git -c user.name='gitee-mirror' \
              -c user.email='gitee-mirror@users.noreply.gitee.com' \
              commit -am 'docs: point README links at this Gitee mirror'
          git push --force "$remote" 'mirror-main:refs/heads/main'
