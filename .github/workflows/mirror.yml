name: Mirror

# GitHub stays the primary repository and the only place release assets live;
# Gitee mirrors branches and tags so the code is reachable from mainland China.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitee
  cancel-in-progress: false

jobs:
  gitee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Needs two repository secrets: GITEE_TOKEN (私人令牌 with 仓库写权限) and
      # GITEE_USER (the Gitee account name). Without them the mirror is skipped
      # with a warning so a fork or a fresh clone never fails on it.
      - name: Push branches and tags to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_USER" ]; then
            echo "::warning::GITEE_TOKEN or GITEE_USER is not set; skipping the Gitee mirror"
            exit 0
          fi
          remote="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/graphite-office/office-suites.git"
          # GitHub is authoritative, so mirror with force, prune and prune-tags:
          # a rebase or a tag deleted on GitHub has to win here as well.
          git push --force --prune --prune-tags "$remote" \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

          # The mirror's main is then replaced by one extra commit whose READMEs
          # point at Gitee. Build it from origin/main explicitly: a tag-triggered
          # run has a tag checked out, not the branch head.
          git fetch --no-tags origin main
          git checkout -B mirror-main FETCH_HEAD
          python3 scripts/render_mirror_readme.py
          if git diff --quiet -- README.md README.en.md; then
            echo "READMEs already point at the mirror; nothing to commit"
            exit 0
          fi
          git -c user.name='gitee-mirror' \
              -c user.email='gitee-mirror@users.noreply.gitee.com' \
              commit -am 'docs: point README links at this Gitee mirror'
          git push --force "$remote" 'mirror-main:refs/heads/main'
