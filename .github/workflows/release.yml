name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  guard:
    runs-on: ubuntu-latest
    steps:
      # A tag pushed from a stale branch would publish old code under a new
      # version number, so releases must be cut from main.
      - name: Require the tag to be cut from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main" --jq .status)
          echo "tag ${GITHUB_REF_NAME} vs main: ${status}"
          case "$status" in
            ahead|identical) ;;
            *)
              echo "::error::${GITHUB_REF_NAME} is not on main (compare status: ${status}); tag the released commit instead"
              exit 1
              ;;
          esac
  build:
    needs: [verify, guard]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: darwin
            goarch: amd64
          # The CGO-free CLI cross-compiles on Ubuntu for all targets.
          - os: ubuntu-latest
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          # -buildvcs=false keeps bytes independent of git state, so rebuilding
          # the same commit reproduces the same SHA-256 the launchers pin.
          go build -trimpath -buildvcs=false -ldflags "-s -w" -o "dist/shimo-net_${GOOS}_${GOARCH}${EXT}" ./cli
      - uses: actions/upload-artifact@v4
        with:
          name: shimo-net_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
  release:
    needs: build
    permissions:
      contents: write
      # npm verifies this job's OIDC identity against the trusted publisher
      # registered for shimo-net-cli, so no long-lived token is stored.
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shimo-net_*
          path: dist
          merge-multiple: true
      - name: Add bootstrap assets
        run: |
          mkdir -p dist
          cp bootstrap.sh dist/bootstrap.sh
          cp docs/agent/SKILL.md dist/SKILL.md
      - name: Package SkillHub and WorkBuddy uploads
        run: python3 scripts/package_skillhub.py --tag "$GITHUB_REF_NAME" --out-dir dist --target both
      - name: Package self-contained npm distribution
        run: python3 scripts/package_npm.py --tag "$GITHUB_REF_NAME" --assets-dir dist --out-dir dist
      # Overwrite every asset from this run so a re-run replaces the whole set
      # instead of leaving a mix of old and new binaries behind.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          overwrite_files: true
          fail_on_unmatched_files: true
      # Every asset must be byte-identical to what this build produced, so an
      # upload that silently kept an older file fails the run instead of users.
      - name: Verify published assets match this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_release.py dist --tag "$GITHUB_REF_NAME" --token "$GH_TOKEN"
      # The skill installs shimo-net-cli from npm, so the registry has to carry
      # this version too. Publishing is tokenless: npm matches this job's OIDC
      # identity against the trusted publisher registered on npmjs.com.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Ensure an npm CLI that can publish over OIDC
        run: |
          # Trusted publishing requires npm >= 11.5.1.
          if ! node -e 'const v=require("child_process").execSync("npm --version").toString().trim().split("-")[0].split(".").map(Number);process.exit(v[0]>11||(v[0]===11&&(v[1]>5||(v[1]===5&&v[2]>=1)))?0:1)'; then
            npm install -g npm@latest
          fi
          npm --version
      - name: Publish to npm
        env:
          # Fallback only. OIDC wins when the trusted publisher is registered;
          # a granular token keeps the step working during migration.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "shimo-net-cli@${version}" version >/dev/null 2>&1; then
            echo "shimo-net-cli@${version} is already published; skipping"
            exit 0
          fi
          # The ./ prefix matters: without it npm reads the argument as the
          # GitHub shorthand owner/repo and fails with a git ls-remote error.
          if npm publish "./dist/shimo-net-cli-${version}.tgz" --access public; then
            # The registry accepts the upload several seconds before the new
            # version becomes readable, so poll instead of failing on the gap.
            for attempt in $(seq 1 12); do
              if npm view "shimo-net-cli@${version}" version; then
                exit 0
              fi
              echo "registry has not exposed ${version} yet (attempt ${attempt}); waiting"
              sleep 15
            done
            echo "::error::npm accepted ${version}, but registry visibility could not be verified within 180s; check registry availability and re-run this job"
            exit 1
          fi
          # GitHub assets already exist, but npm is required for installation:
          # an upload failure must fail the release job. Re-running is safe.
          {
            echo "### npm 未发布 ${version}"
            echo
            echo "请先检查上方 npm 错误及 registry 网络状态；若是认证失败，在 npmjs.com → shimo-net-cli → Settings → Trusted publishing 检查 GitHub Actions："
            echo "organization/user = shimo-office，repository = office-suites，workflow = release.yml，勾选 npm publish。"
            echo "修复后重跑本 job 即可补发；构建可复现，重跑不会改变已上传资产的哈希。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::npm publish ${version} failed; inspect the npm error above, check registry access and publishing credentials, then re-run this job"
          exit 1
