name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: darwin
            goarch: amd64
          # The CGO-free CLI cross-compiles on Ubuntu for all targets.
          - os: ubuntu-latest
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags "-s -w" -o "dist/shimo-net_${GOOS}_${GOARCH}${EXT}" ./cli
      - uses: actions/upload-artifact@v4
        with:
          name: shimo-net_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shimo-net_*
          path: dist
          merge-multiple: true
      - name: Add bootstrap assets
        run: |
          mkdir -p dist
          cp bootstrap.sh dist/bootstrap.sh
          cp docs/agent/SKILL.md dist/SKILL.md
      - name: Package SkillHub and WorkBuddy uploads
        run: python3 scripts/package_skillhub.py --tag "$GITHUB_REF_NAME" --assets-dir dist --out-dir dist --target both
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
