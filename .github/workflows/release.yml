name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  guard:
    runs-on: ubuntu-latest
    steps:
      # A tag pushed from a stale branch would publish old code under a new
      # version number, so releases must be cut from main.
      - name: Require the tag to be cut from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main" --jq .status)
          echo "tag ${GITHUB_REF_NAME} vs main: ${status}"
          case "$status" in
            ahead|identical) ;;
            *)
              echo "::error::${GITHUB_REF_NAME} is not on main (compare status: ${status}); tag the released commit instead"
              exit 1
              ;;
          esac
  build:
    needs: [verify, guard]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: darwin
            goarch: amd64
          # The CGO-free CLI cross-compiles on Ubuntu for all targets.
          - os: ubuntu-latest
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          # -buildvcs=false keeps bytes independent of git state, so rebuilding
          # the same commit reproduces the same SHA-256 the launchers pin.
          go build -trimpath -buildvcs=false -ldflags "-s -w" -o "dist/shimo-net_${GOOS}_${GOARCH}${EXT}" ./cli
      - uses: actions/upload-artifact@v4
        with:
          name: shimo-net_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shimo-net_*
          path: dist
          merge-multiple: true
      - name: Add bootstrap assets
        run: |
          mkdir -p dist
          cp bootstrap.sh dist/bootstrap.sh
          cp docs/agent/SKILL.md dist/SKILL.md
      - name: Package SkillHub and WorkBuddy uploads
        run: python3 scripts/package_skillhub.py --tag "$GITHUB_REF_NAME" --assets-dir dist --out-dir dist --target both
      - name: Package self-contained npm distribution
        run: python3 scripts/package_npm.py --tag "$GITHUB_REF_NAME" --assets-dir dist --out-dir dist
      # Overwrite every asset from this run so a re-run replaces the whole set
      # instead of leaving a mix of old and new binaries behind.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          overwrite_files: true
          fail_on_unmatched_files: true
      # The launchers pin a SHA-256 per platform, so the release is only usable
      # while those digests match the uploaded binaries. Fail the run otherwise.
      - name: Verify published assets match the packaged launchers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in dist/*-workbuddy.zip dist/*-skillhub.zip; do
            python3 scripts/verify_release.py "$archive" --token "$GH_TOKEN"
          done
      # The skill installs shimo-net-cli at the same version, so npm has to carry
      # it too. Skipped with a warning until the NPM_TOKEN secret exists, and
      # idempotent when the version is already published.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set; publish shimo-net-cli@${version} manually"
            exit 0
          fi
          if npm view "shimo-net-cli@${version}" version >/dev/null 2>&1; then
            echo "shimo-net-cli@${version} is already published; skipping"
            exit 0
          fi
          npm publish dist/shimo-net-cli-*.tgz --access public
          npm view "shimo-net-cli@${version}" version
