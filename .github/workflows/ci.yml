name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Test-only runtime for executing the generated browser guard scripts.
      # The distributed Go CLI does not depend on Node.js.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require JavaScript regression runtime
        run: node --version
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Documentation and generated catalog
        run: |
          python scripts/generate_capabilities.py --check
          python -m unittest discover -s scripts -p "test_*.py"
          python scripts/check_docs.py
      - name: Test with statement coverage
        run: go test -count=1 -coverprofile=coverage.out ./cli
      - name: Enforce 80 percent statement coverage
        run: python scripts/check_coverage.py coverage.out
      - name: Vet
        run: go vet ./cli
      - name: Build
        run: go build -trimpath -o bin/shimo-net ./cli
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: ignore
