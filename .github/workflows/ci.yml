name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Test-only runtime for executing the generated browser guard scripts.
      # The distributed Go CLI does not depend on Node.js.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require JavaScript regression runtime
        run: node --version
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: Generated catalog
        run: python scripts/generate_capabilities.py --check
      - name: Tool regression tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Documentation checks
        run: python scripts/check_docs.py
      # -timeout keeps a slow Windows runner from turning a real failure into
      # a ten-minute panic that hides which test broke. The log is kept so the
      # failing case can be named in the summary below.
      - name: Test with statement coverage
        id: gotests
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -timeout 20m "-coverprofile=coverage.out" ./cli 2>&1 | tee gotest.log
      # go test prints "--- FAIL" lines that never reach the annotations, so a
      # red job would otherwise say only "exit code 1".
      - name: Name failing tests
        if: failure() && steps.gotests.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### 失败的测试"
            echo '```'
            grep -A 8 -E '^(--- FAIL|panic:|FAIL[[:space:]])' gotest.log | head -120 || echo "no FAIL lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce 80 percent statement coverage
        run: python scripts/check_coverage.py coverage.out
      - name: Check reachable Go vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./cli
      - name: Vet
        run: go vet ./cli
      - name: Build
        run: go build -trimpath -o bin/shimo-net ./cli
      - name: Preserve coverage and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.out
            gotest.log
          if-no-files-found: ignore
