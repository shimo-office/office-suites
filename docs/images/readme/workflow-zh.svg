<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="title desc">
<title id="title">从一句话，到一份交付</title><desc id="desc">终端或 AI 助手通过 shimo-net 连接石墨，完成查找、读取、整理与交付；这是流程示意。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b8496"/></marker></defs>
<rect width="800" height="330" rx="20" fill="#f3f8fc"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="14" font-weight="650" fill="#397183">SHIMO-NET / WORKFLOW</text><text x="32" y="87" font-size="32" font-weight="700" fill="#173449">从一句话，到一份交付</text><rect x="32" y="122" width="192" height="112" rx="14" fill="#ffffff" stroke="#d7e5ed"/><text x="48" y="166" font-size="22" font-weight="650" fill="#173449">终端 / AI 助手</text><text x="48" y="202" font-size="17" font-weight="400" fill="#4a687c">描述你的任务</text><path d="M236 178H288" fill="none" stroke="#5b8496" stroke-width="2" marker-end="url(#arrow)"/><rect x="304" y="122" width="192" height="112" rx="14" fill="#173449" stroke="#d7e5ed"/><text x="320" y="166" font-size="22" font-weight="650" fill="#ffffff">shimo-net</text><text x="320" y="202" font-size="17" font-weight="400" fill="#c6e2ef">执行与核对</text><path d="M508 178H560" fill="none" stroke="#5b8496" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="122" width="192" height="112" rx="14" fill="#ffffff" stroke="#d7e5ed"/><text x="592" y="166" font-size="22" font-weight="650" fill="#173449">石墨办公</text><text x="592" y="202" font-size="17" font-weight="400" fill="#4a687c">公有云 / 私有部署</text><path d="M32 261H768" stroke="#d7e5ed"/><circle cx="37" cy="295" r="4" fill="#0d9488"/><text x="50" y="302" font-size="19" font-weight="400" fill="#173449">查找文件</text><circle cx="235" cy="295" r="4" fill="#0d9488"/><text x="248" y="302" font-size="19" font-weight="400" fill="#173449">读取内容</text><circle cx="433" cy="295" r="4" fill="#0d9488"/><text x="446" y="302" font-size="19" font-weight="400" fill="#173449">整理编辑</text><circle cx="631" cy="295" r="4" fill="#0d9488"/><text x="644" y="302" font-size="19" font-weight="400" fill="#173449">下载交付</text></g></svg>
