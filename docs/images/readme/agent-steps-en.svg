<svg xmlns="http://www.w3.org/2000/svg" width="800" height="190" viewBox="0 0 800 190" role="img" aria-labelledby="title desc">
<title id="title">Four-step onboarding</title><desc id="desc">Workflow illustration, not an actual screenshot.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b8496"/></marker></defs>
<rect width="800" height="190" rx="20" fill="#f3f8fc"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="35" font-size="23" font-weight="650" fill="#173449">Get started in four steps</text><circle cx="45" cy="76" r="17" fill="#173449"/><text x="40" y="83" font-size="20" font-weight="650" fill="#ffffff">1</text><path d="M74 76H193" stroke="#aac5d3" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="127" font-size="21" font-weight="650" fill="#173449">Open assistant</text><text x="28" y="160" font-size="18" font-weight="400" fill="#4a687c">Local task</text><circle cx="240" cy="76" r="17" fill="#173449"/><text x="235" y="83" font-size="20" font-weight="650" fill="#ffffff">2</text><path d="M269 76H388" stroke="#aac5d3" stroke-width="2" marker-end="url(#arrow)"/><text x="223" y="127" font-size="21" font-weight="650" fill="#173449">Request setup</text><text x="223" y="160" font-size="18" font-weight="400" fill="#4a687c">Connect Skill</text><circle cx="435" cy="76" r="17" fill="#173449"/><text x="430" y="83" font-size="20" font-weight="650" fill="#ffffff">3</text><path d="M464 76H583" stroke="#aac5d3" stroke-width="2" marker-end="url(#arrow)"/><text x="418" y="127" font-size="21" font-weight="650" fill="#173449">Log in</text><text x="418" y="160" font-size="18" font-weight="400" fill="#4a687c">Check account</text><circle cx="630" cy="76" r="17" fill="#173449"/><text x="625" y="83" font-size="20" font-weight="650" fill="#ffffff">4</text><text x="613" y="127" font-size="21" font-weight="650" fill="#173449">Start working</text><text x="613" y="160" font-size="18" font-weight="400" fill="#4a687c">Verify results</text></g></svg>
